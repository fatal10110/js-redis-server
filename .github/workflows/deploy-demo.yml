name: Deploy browser demo

# Builds examples/browser-demo and publishes it to GitHub Pages.
#
# The build job also runs on pull requests, with the Pages steps skipped, so a
# change that breaks the demo's install or build fails in review instead of
# turning main red after the merge. Before this, the demo was only ever built
# post-merge and a broken lockfile sat on main for two months (#391).
#
# One-time setup: repo Settings → Pages → Source → "GitHub Actions".
on:
  push:
    branches: [main]
    # Only redeploy when the demo or the inputs it actually consumes change.
    # The root manifests are in here because the job runs `npm ci` at the root
    # too. The root tsconfig is in here because it is a build input: Vite
    # resolves the nearest tsconfig per file, so every src/** file is still
    # transformed under it (`module: nodenext` infers target es2022, which
    # defaults useDefineForClassFields to true — it changes class-field emit
    # and the content hash). examples/browser-demo/tsconfig.json covers only
    # the demo's own files. It is also the config `tsx` loads for `test:demo`.
    paths:
      - 'examples/browser-demo/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/deploy-demo.yml'
  # Deliberately NOT paths-filtered. The build is ~1 minute, and an unfiltered
  # check is one that always reports, so it stays eligible as a required check
  # — a paths-filtered one sits on "Expected — Waiting for status" forever and
  # can only ever be advisory. It also keeps this list from drifting out of
  # sync with a second copy. This workflow is the only place `test:demo` runs.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; let an in-progress run finish. PR builds get their own
# per-ref group so they never queue behind a deploy, and a superseded PR build
# is cancelled.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Backstop for a hung `test:demo` run on Node 24, where --test-timeout
    # cannot end a process that stays alive (#454).
    timeout-minutes: 15
    # Scoped per job rather than workflow-wide: this job runs `npm ci` twice
    # over a lockfile the PR author controls, so install lifecycle scripts
    # execute here. `id-token: write` belongs to `deploy` alone — only
    # actions/deploy-pages consumes it. `pages: write` is for configure-pages,
    # which is skipped on pull_request.
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # Both lockfiles, or a demo-only dependency change hits the root
          # cache key exactly, restores stale demo tarballs, re-downloads the
          # new ones and never saves them — on precisely the Dependabot PRs
          # this job exists to gate.
          cache-dependency-path: |
            package-lock.json
            examples/browser-demo/package-lock.json

      # Root deps, and this step must stay ahead of the demo build: the demo
      # imports ../../src, which pulls cluster-key-slot and lua-redis-wasm
      # from the root node_modules, and vite.config.ts reads that same
      # lua-redis-wasm to build the jsDelivr URL. Also provides tsx for the
      # demo's own tests below.
      - name: Install root deps
        run: npm ci

      - name: Install demo deps
        run: npm ci
        working-directory: examples/browser-demo

      # The tests below run transpile-only (tsx), so typecheck separately.
      # Uses the root's TypeScript against the demo's own tsconfig; needs both
      # installs above (vite/client types come from the demo tree, @types/node
      # and ../../src's deps from the root). Also type-checks the demo's
      # ../../src imports under this browser-oriented config (DOM lib, bundler
      # resolution) — note the bundle transforms src/** under the root
      # tsconfig; only the demo's own files use examples/browser-demo's.
      - name: Typecheck demo
        run: npx tsc -p examples/browser-demo

      - name: Run demo tests
        run: npm run test:demo

      - name: Build demo
        run: npm run build
        working-directory: examples/browser-demo

      # vite-plugin-node-polyfills inlines what it polyfills into the shipped
      # artifact, so "it's only a dev dependency" does not hold for it (#393).
      # The demo polyfills only `buffer` and shims crypto's SHA-1; this fails
      # the build if a config change lets crypto-browserify's `elliptic` back
      # into the Pages bundle.
      # grep exits 0 on a match, 1 on none, 2 on error (e.g. the glob matched
      # no file) — only 1 is a pass, so the guard can't pass vacuously.
      - name: Check bundle has no elliptic
        run: |
          shopt -s nullglob
          bundles=(dist/assets/*.js)
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "::error::no dist/assets/*.js to check"
            exit 1
          fi
          rc=0
          grep -l -E 'elliptic|secp256k1' "${bundles[@]}" || rc=$?
          if [ "$rc" -ne 1 ]; then
            if [ "$rc" -eq 0 ]; then
              echo "::error::elliptic/secp256k1 found in the demo bundle (#393)"
            else
              echo "::error::grep failed (exit $rc) checking the demo bundle"
            fi
            exit 1
          fi
        working-directory: examples/browser-demo

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: examples/browser-demo/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
