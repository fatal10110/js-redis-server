name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npx prettier --check "**/*.{js,ts,json}"

  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

  packages:
    name: package (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [js-redis-server, js-valkey-server]
    env:
      NPM_PACKAGE_NAME: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Select npm package identity
        run: |
          npm pkg set "name=$NPM_PACKAGE_NAME"
          npm pkg delete bin
          npm pkg set "bin.$NPM_PACKAGE_NAME=./dist/cli.js"
      - name: Verify both module formats and package contents
        run: |
          npm run test:package
          npm pack --dry-run --ignore-scripts

  integration:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: raw-mock
            script: test:integration:raw:mock
          - name: compatibility-profiles-mock
            script: test:integration:compatibility:mock
          - name: raw-real
            script: test:integration:raw:real
            needsRedis: true
          - name: ioredis-mock
            script: test:integration:mock:ioredis
          - name: ioredis-real
            script: test:integration:real:ioredis
            needsRedis: true
          - name: node-redis-mock
            script: test:integration:mock:node-redis
          - name: node-redis-real
            script: test:integration:real:node-redis
            needsRedis: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Redis (cluster + standalone)
        if: matrix.needsRedis
        # --wait-timeout is the OUTER backstop, not the primary budget. The
        # cluster init script gives up first (294s worst case, even with a hung
        # node) and exits non-zero after dumping CLUSTER INFO/NODES and every
        # node's log, which the step below then surfaces. The healthcheck's
        # start_period (330s) sits between the two. 420s keeps that ordering:
        # set it below the script's budget and the retries and the diagnostics
        # both become unreachable, which is how #398 stayed undiagnosed for
        # three sightings. See the budget block in
        # docker/redis-cluster-init.sh before changing.
        run: docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 420

      - name: Run integration tests (${{ matrix.name }})
        env:
          # Points the harness at the standalone service for SELECT/multi-DB
          # tests that cluster mode cannot serve (see test-config.ts).
          # Ignored by the mock backend.
          REDIS_STANDALONE_PORT: 6399
          # Password-protected standalone for AUTH/NOAUTH enforcement tests.
          REDIS_STANDALONE_AUTH_PORT: 6400
        run: npm run ${{ matrix.script }}

      # Runs whenever an earlier step failed — including the startup step, so a
      # container that dies during cluster formation leaves a diagnosable trail
      # instead of a bare "exited (1)" (issue #398).
      - name: Dump Redis container state and logs on failure
        if: failure() && matrix.needsRedis
        run: |
          echo "::group::docker compose ps -a"
          docker compose -f docker-compose.test.yml ps -a || true
          echo "::endgroup::"
          for svc in redis-cluster redis-standalone redis-standalone-auth; do
            echo "::group::docker compose logs $svc"
            docker compose -f docker-compose.test.yml logs --no-color --timestamps "$svc" || true
            echo "::endgroup::"
          done
          echo "::group::redis-cluster container state"
          cid=$(docker compose -f docker-compose.test.yml ps -aq redis-cluster || true)
          if [ -n "$cid" ]; then
            docker inspect --format '{{json .State}}' "$cid" || true
          else
            echo "no redis-cluster container found"
          fi
          echo "::endgroup::"

      - name: Stop Redis (cluster + standalone)
        if: always() && matrix.needsRedis
        run: docker compose -f docker-compose.test.yml down -v
