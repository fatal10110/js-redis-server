services:
  # Redis 8.0 cluster. grokzen/redis-cluster never published an 8.x tag, so we
  # run our own 6-node cluster from the official image. All six redis-server
  # processes live in ONE container so they reach each other over 127.0.0.1 and
  # the host port map is 1:1 — each node announces 127.0.0.1:<port>, which makes
  # MOVED/ASK redirects resolvable from a Mac host (the same property that made
  # grokzen "just work"). Bus ports default to client-port + 10000 (40000-4000x)
  # and stay container-internal — host clients only ever touch the client ports.
  redis-cluster:
    image: redis:8.0
    platform: linux/amd64
    ports:
      - '30000-30005:30000-30005'
    volumes:
      # Read-only mount of the init script. It lives outside this file so it can
      # be read, commented and run on its own; see the header comment there for
      # the startup races it guards against (issue #398).
      - ./docker/redis-cluster-init.sh:/usr/local/bin/redis-cluster-init.sh:ro
    command: ['sh', '/usr/local/bin/redis-cluster-init.sh']
    healthcheck:
      # Two conditions, both required:
      #   * the init script signed off (marker file) — so `up --wait` can never
      #     return while it is still retrying or waiting for roles to settle;
      #   * EVERY node still reports cluster_state:ok — so a node dying later
      #     turns the container unhealthy.
      # `get a` answers before the cluster has finished forming, which lets
      # clients connect to a half-built cluster and hang on slot lookups; and
      # checking node 30000 alone still passes while another node is unjoined.
      test:
        [
          'CMD-SHELL',
          'test -f /run/redis-cluster-ready && for p in 30000 30001 30002 30003 30004 30005; do redis-cli -p $$p cluster info 2>/dev/null | grep -q cluster_state:ok || exit 1; done',
        ]
      interval: 5s
      timeout: 10s
      # 30s grace + 40 x 5s = 230s, just inside the workflow's --wait-timeout,
      # so a stuck cluster fails the step with logs rather than the job's clock.
      retries: 40
      start_period: 30s

  # Standalone (non-cluster) Redis. Cluster mode rejects SELECT and exposes a
  # single logical database, so integration tests that need multiple databases
  # or SELECT (e.g. SELECT inside MULTI/EXEC) connect here instead. The harness
  # uses it when REDIS_STANDALONE_PORT is set; see tests-integration/test-config.ts.
  redis-standalone:
    image: redis:8.0
    ports:
      - '6399:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '6379', 'ping']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  # Password-protected standalone Redis (requirepass). The default password-less
  # services cannot exercise AUTH/NOAUTH enforcement, so auth integration tests
  # connect here. The harness uses it when REDIS_STANDALONE_AUTH_PORT is set;
  # see tests-integration/test-config.ts (STANDALONE_AUTH_PASSWORD).
  redis-standalone-auth:
    image: redis:8.0
    command:
      [
        'redis-server',
        '--requirepass',
        'testpass',
        '--save',
        '',
        '--appendonly',
        'no',
      ]
    ports:
      - '6400:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '6379', '-a', 'testpass', 'ping']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
